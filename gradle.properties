# Project-wide Gradle settings.

# AndroidX - REQUIRED for all modern Android libraries (CameraX, Material, etc.)
android.useAndroidX=true

# Point Gradle daemon to Android Studio's bundled JDK 17 (required by AGP 8.x)
# Set this via: Android Studio → File → Settings → Build → Gradle → Gradle JDK
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

android.nonTransitiveRClass=true

# Increase JVM heap size to prevent OutOfMemory errors during large builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable Gradle build caching for faster subsequent builds
org.gradle.caching=true

# Enable parallel project execution
org.gradle.parallel=true

# Explicitly set the compile SDK to avoid any defaults
android.sdk.compileSdkVersion=37
