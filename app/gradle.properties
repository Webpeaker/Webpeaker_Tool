# Project-wide Gradle settings.

# AndroidX - REQUIRED for all modern Android libraries (CameraX, Material, etc.)
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from the library's
# dependencies, thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true

# Increase JVM heap size to prevent OutOfMemory errors during large builds
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build caching for faster subsequent builds
org.gradle.caching=true

# Enable parallel project execution
org.gradle.parallel=true
android.suppressUnsupportedCompileSdk=35
